<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Productoras</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <h1>Películas IUD</h1>
    <nav>
      <a href="index.html">Medias</a>
      <a href="genero.html">Géneros</a>
      <a href="director.html">Directores</a>
      <a href="productora.html" class="active">Productoras</a>
      <a href="tipo.html">Tipos</a>
    </nav>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h2>Gestión de Productoras</h2>
        <p>Administración de productoras de películas y series</p>
      </div>
      <button id="btnNueva">+ Nueva productora</button>
    </header>

    <section class="card">
      <div class="table-wrap">
        <table>
          <thead><tr id="tablaHead"></tr></thead>
          <tbody id="tablaBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button class="close" id="btnCerrar">×</button>
      <h2 id="formTitulo">Nueva Productora</h2>
      <form id="itemForm">
        <div class="grid" id="camposForm"></div>
        <div class="actions">
          <button type="button" class="secondary" id="btnCancelar">Cancelar</button>
          <button type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    window.CATALOG = {
      resource: "productoras",
      singular: "Productora",
      fields: [
        { name: "nombre", label: "Nombre", required: true },
        { name: "estado", label: "Estado", type: "select", options: ["Activo", "Inactivo"], required: true },
        { name: "slogan", label: "Slogan" },
        { name: "descripcion", label: "Descripción", type: "textarea" }
      ]
    };
  </script>
  <script src="catalog.js"></script>
</body>
</html>
