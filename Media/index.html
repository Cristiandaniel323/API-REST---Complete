<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Medias</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <h1>Películas IUD</h1>
    <nav>
      <a href="index.html" class="active">Medias</a>
      <a href="genero.html">Géneros</a>
      <a href="director.html">Directores</a>
      <a href="productora.html">Productoras</a>
      <a href="tipo.html">Tipos</a>
    </nav>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h2>Gestión de Medias</h2>
        <p>Administración de películas y series</p>
      </div>
      <button id="btnNueva">+ Nueva media</button>
    </header>

    <section class="toolbar">
      <input id="buscar" type="search" placeholder="Buscar por título o serial...">
      <select id="filtroTipo">
        <option value="">Todos los tipos</option>
      </select>
    </section>

    <section class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Portada</th><th>Serial</th><th>Título</th><th>Año</th>
              <th>Género</th><th>Director</th><th>Productora</th><th>Tipo</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaMedias"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button class="close" id="btnCerrar">×</button>
      <h2 id="formTitulo">Nueva Media</h2>
      <form id="mediaForm">
        <div class="grid">
          <label>Serial<input name="serial" required></label>
          <label>Título<input name="titulo" required></label>
          <label class="full">Sinopsis<textarea name="sinopsis" rows="4" required></textarea></label>
          <label>URL de la película<input name="url" type="url" required></label>
          <label>URL de portada<input name="imagen" type="url" required></label>
          <label>Año de estreno<input name="anio" type="number" min="1900" max="2100" required></label>
          <label>Género<select name="genero" id="genero" required></select></label>
          <label>Director<select name="director" id="director" required></select></label>
          <label>Productora<select name="productora" id="productora" required></select></label>
          <label>Tipo<select name="tipo" id="tipo" required></select></label>
        </div>
        <div class="actions">
          <button type="button" class="secondary" id="btnCancelar">Cancelar</button>
          <button type="submit">Guardar media</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
